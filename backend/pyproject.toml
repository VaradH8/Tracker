[project]
name = "tracker-backend"
version = "0.1.0"
description = "Project Tracker — backend"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.32",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<1.14",
    "psycopg[binary]>=3.2,<3.3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "passlib[bcrypt]>=1.7.4,<2",
    "itsdangerous>=2.2,<3",
    "apscheduler>=3.10,<4",
    "aiosmtplib>=3.0,<4",
    "jinja2>=3.1,<4",
    "openpyxl>=3.1,<4",
    "redis>=5.0,<6",
    "python-multipart>=0.0.9,<0.1",
    "boto3>=1.34,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<0.24",
    "httpx>=0.27,<0.28",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
