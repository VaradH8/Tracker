name: Build & push app image

# Builds the Next.js app image (demo/) and pushes it to GitHub Container
# Registry. Portainer then pulls this pre-built image instead of building
# on the host (Swarm/host can't build). Runs on every push to main.

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - ".github/workflows/build-app.yml"
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/varadh8/tracker-app

jobs:
  # Gate: typecheck + unit tests + a production build must pass before we
  # publish an image. Without this, a broken build could be pushed to
  # :latest and pulled into production on the next redeploy.
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: demo/package-lock.json

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # Also part of `npm test`; its own step so an accessibility failure is
      # named as one in the run summary. axe-core over the shared components
      # and the sign-in page (WCAG 2.x A/AA) — see __tests__/a11y.test.tsx.
      - name: Accessibility check (axe)
        run: npx vitest run __tests__/a11y.test.tsx

      - name: Production build
        # A placeholder DATABASE_URL is enough — the build doesn't connect,
        # it only needs the var to be present for module-load validation.
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder?schema=public
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./demo
          file: ./demo/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Auto-deploy: tell Portainer to redeploy the `tracker` stack once the new
  # :latest image is in GHCR. The stack is a git stack whose app image is
  # ghcr.io/varadh8/tracker-app:${APP_IMAGE_TAG:-latest}; with APP_IMAGE_TAG
  # unset, a redeploy pulls the image this run just pushed.
  #
  # The webhook URL is the stack's GitOps webhook (Portainer → stack tracker →
  # GitOps updates → Webhook), stored as the PORTAINER_WEBHOOK_URL secret of
  # the Production environment. Without it the image is pushed and the deploy
  # is skipped with a notice, as before.
  #
  # The webhook only redeploys when the git commit changed, so a re-run of an
  # already-deployed commit does nothing; use Portainer's "Pull and redeploy".
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    concurrency:
      group: tracker-production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy via Portainer webhook
        id: deploy
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::notice::PORTAINER_WEBHOOK_URL not set: image pushed, deploy skipped."
            echo "result=skipped" >> "$GITHUB_OUTPUT"; exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST --max-time 60 "$WEBHOOK" || echo 000)
          echo "result=$code" >> "$GITHUB_OUTPUT"
          case "$code" in 2*) echo "Webhook OK ($code)";; *) echo "::error::Portainer webhook returned $code"; exit 1;; esac

      - name: Verify health
        if: steps.deploy.outputs.result != 'skipped'
        env:
          URL: ${{ vars.APP_URL || 'https://tracker.inventivebizsol.co.in' }}/api/health
        run: |
          sleep 45
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL" || echo 000)
            echo "attempt $i: $code"; [ "$code" = 200 ] && exit 0; sleep 15
          done
          echo "::error::$URL never returned 200 after the deploy"; exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy"
            echo "- Image: \`${{ env.IMAGE }}:${{ github.sha }}\` (also \`:latest\`)"
            echo "- Portainer webhook: ${{ steps.deploy.outputs.result || 'not run' }}"
          } >> "$GITHUB_STEP_SUMMARY"
