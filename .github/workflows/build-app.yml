name: Build & push app image

# Builds the Next.js app image (demo/) and pushes it to GitHub Container
# Registry. Portainer then pulls this pre-built image instead of building
# on the host (Swarm/host can't build). Runs on every push to main.

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - ".github/workflows/build-app.yml"
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/varadh8/tracker-app

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./demo
          file: ./demo/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
