# Production stack for the shared Inventive Swarm.
#
# Ingress goes through the existing Traefik reverse proxy (external),
# which terminates TLS on the `https` entrypoint (cert resolver `le`)
# and routes ${PUBLIC_HOST} -> app:3000. There is NO Caddy and NO
# published host ports here — Traefik owns 80/443.
#
# Postgres + the app image (pulled from GHCR) + nightly backups run on
# the manager node. Stateful data lives in named volumes (bind mounts
# aren't reliable across a Swarm), and the stateful services are pinned
# to node.role==manager so their volumes stay put.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracker}
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - tracker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracker} -d ${POSTGRES_DB:-tracker}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [tracker_net]
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints: ["node.role == manager"]

  app:
    # Pre-built in GitHub Actions and pushed to GHCR (public). Swarm
    # can't build images, so we pull this instead of a local build.
    image: ghcr.io/varadh8/tracker-app:latest
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tracker}?schema=public
      NODE_ENV: production
      # Runs `prisma db seed` on boot when "1". The seed is now a safe
      # first-boot bootstrap: it only populates an EMPTY database and
      # skips (touching nothing) once real users exist, so leaving this at
      # "1" can no longer wipe production data on redeploy/restart. Still,
      # "0" after first boot is tidiest.
      RUN_SEED: ${RUN_SEED:-0}
      # SMTP — leave blank to keep EmailLog-only mode (no real mail).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      UPLOAD_DIR: /uploads
    volumes:
      - tracker_uploads:/uploads
    networks:
      - tracker_net
      - traefik-public
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints: ["node.role == manager"]
      labels:
        # This Traefik uses the swarm provider with entrypoints named
        # `web` (:80) and `websecure` (:443); http->https redirect is
        # global, and its default provider network is traefik-public.
        - "traefik.enable=true"
        - "traefik.constraint-label=traefik-public"
        - "traefik.http.routers.tracker.rule=Host(`${PUBLIC_HOST}`)"
        - "traefik.http.routers.tracker.entrypoints=websecure"
        - "traefik.http.routers.tracker.tls=true"
        - "traefik.http.routers.tracker.tls.certresolver=le"
        # The app listens on 3000
        - "traefik.http.services.tracker.loadbalancer.server.port=3000"

  # Daily pg_dump into the tracker_backups volume. Keeps 14 daily /
  # 8 weekly / 6 monthly snapshots.
  pg_backup:
    image: prodrigestivill/postgres-backup-local:16
    depends_on:
      - postgres
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-tracker}
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_EXTRA_OPTS: "-Z6 --no-owner --no-acl"
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "14"
      BACKUP_KEEP_WEEKS: "8"
      BACKUP_KEEP_MONTHS: "6"
      HEALTHCHECK_PORT: "8080"
    volumes:
      - tracker_backups:/backups
    networks: [tracker_net]
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints: ["node.role == manager"]

  # Optional off-host copy of the daily dumps. Loops hourly: if rclone
  # is configured (RCLONE_BACKUP_DEST set) it syncs the backups volume
  # to the remote; otherwise it sleeps quietly.
  rclone_backup:
    image: rclone/rclone:latest
    depends_on:
      - pg_backup
    environment:
      RCLONE_CONFIG_REMOTE_TYPE: ${RCLONE_CONFIG_REMOTE_TYPE:-}
      RCLONE_CONFIG_REMOTE_PROVIDER: ${RCLONE_CONFIG_REMOTE_PROVIDER:-}
      RCLONE_CONFIG_REMOTE_ENDPOINT: ${RCLONE_CONFIG_REMOTE_ENDPOINT:-}
      RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID: ${RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY:-}
      RCLONE_BACKUP_DEST: ${RCLONE_BACKUP_DEST:-}
    volumes:
      - tracker_backups:/backups:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          if [ -n "$$RCLONE_BACKUP_DEST" ]; then
            echo "rclone sync /backups -> $$RCLONE_BACKUP_DEST"
            rclone sync /backups "$$RCLONE_BACKUP_DEST" --transfers 4 || true
          else
            echo "rclone: RCLONE_BACKUP_DEST not set, skipping off-host copy"
          fi
          sleep 3600
        done
    networks: [tracker_net]
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints: ["node.role == manager"]

volumes:
  tracker_pgdata:
  tracker_uploads:
  tracker_backups:

networks:
  # Internal overlay for app <-> postgres <-> backups.
  tracker_net:
    driver: overlay
  # Traefik's shared ingress network (already exists on the Swarm).
  traefik-public:
    external: true
