name: tracker

# Production-ready stack: Postgres + the Next.js app.
# - Drop this into Portainer (Stacks → Add stack → paste this file).
# - Set the env vars from .env.example in Portainer's "Environment variables".
# - Postgres data persists in the `tracker_pgdata` named volume.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracker}
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - tracker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracker} -d ${POSTGRES_DB:-tracker}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [tracker_net]

  app:
    build:
      context: ./demo
      dockerfile: Dockerfile
    image: tracker-app:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tracker}?schema=public
      NODE_ENV: production
      # Set to "1" on first boot to populate the demo accounts (varad/manasi/...).
      # Then change to "0" and redeploy.
      RUN_SEED: ${RUN_SEED:-0}
    ports:
      - "${APP_PORT:-3000}:3000"
    networks: [tracker_net]

volumes:
  tracker_pgdata:

networks:
  tracker_net:
    driver: bridge
