name: tracker

# Production-ready stack: Postgres + the Next.js app.
# - Postgres data persists in the `tracker_pgdata` named volume.
# - The app is fronted by the existing Traefik instance on this host.
#   Traefik discovers it by label and routes the configured hostname to
#   port 3000 over the shared `traefik-public` overlay network. No host
#   port is published — all public traffic goes through Traefik on 443.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracker}
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - tracker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracker} -d ${POSTGRES_DB:-tracker}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [tracker_net]

  app:
    build:
      context: ./demo
      dockerfile: Dockerfile
    image: tracker-app:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tracker}?schema=public
      NODE_ENV: production
      # Set to "1" on first boot to populate the demo accounts (varad/manasi/...).
      # Then change to "0" and redeploy.
      RUN_SEED: ${RUN_SEED:-0}
    networks:
      - tracker_net
      - traefik-public
    labels:
      # Opt into Traefik discovery and match the host's constraint label.
      - "traefik.enable=true"
      - "traefik.constraint-label=traefik-public"
      - "traefik.docker.network=traefik-public"

      # HTTPS router: terminate TLS via Let's Encrypt and forward to :3000.
      - "traefik.http.routers.tracker.rule=Host(`${PUBLIC_HOST:?PUBLIC_HOST is required}`)"
      - "traefik.http.routers.tracker.entrypoints=https"
      - "traefik.http.routers.tracker.tls=true"
      - "traefik.http.routers.tracker.tls.certresolver=le"
      - "traefik.http.services.tracker.loadbalancer.server.port=3000"

      # HTTP -> HTTPS permanent redirect for anyone who types `http://`.
      - "traefik.http.routers.tracker-http.rule=Host(`${PUBLIC_HOST:?PUBLIC_HOST is required}`)"
      - "traefik.http.routers.tracker-http.entrypoints=http"
      - "traefik.http.routers.tracker-http.middlewares=tracker-https-redirect"
      - "traefik.http.middlewares.tracker-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.tracker-https-redirect.redirectscheme.permanent=true"

volumes:
  tracker_pgdata:

networks:
  tracker_net:
    driver: bridge
  # Created and managed by the existing Traefik stack on this host.
  # `external: true` means compose will not try to create it.
  traefik-public:
    external: true
