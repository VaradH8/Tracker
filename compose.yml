name: project-tracker

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks: [tracker_net]

  frontend:
    build: ./frontend
    image: tracker-frontend:latest
    restart: unless-stopped
    networks: [tracker_net]

  backend:
    build: ./backend
    image: tracker-backend:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    networks: [tracker_net]

  worker:
    image: tracker-backend:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      backend:
        condition: service_started
    command: python -m app.jobs.scheduler
    profiles: [worker]
    networks: [tracker_net]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [tracker_net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks: [tracker_net]

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:

networks:
  tracker_net:
    driver: bridge
