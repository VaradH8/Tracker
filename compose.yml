name: tracker

# Production stack: Postgres + Next.js app + Caddy reverse proxy.
# Caddy terminates TLS (auto Let's Encrypt) on 443 and forwards to the
# app container on its private docker network. Port 80 is used for the
# Let's Encrypt HTTP-01 challenge and HTTP→HTTPS redirect.
#
# All public traffic enters via Caddy. The app and Postgres have no
# host port mappings — they're only reachable from inside the docker
# network.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracker}
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - tracker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracker} -d ${POSTGRES_DB:-tracker}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [tracker_net]

  app:
    build:
      context: ./demo
      dockerfile: Dockerfile
    image: tracker-app:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tracker}?schema=public
      NODE_ENV: production
      # Set to "1" on first boot to populate the demo accounts (varad/manasi/...).
      # Then change to "0" and redeploy.
      RUN_SEED: ${RUN_SEED:-0}
      # SMTP — set in .env to enable real outbound mail. Empty values
      # leave the app in EmailLog-only mode (no actual email sent).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Attachments live on a host bind mount so they survive a stack
      # rebuild. Mounted at /uploads inside the container.
      UPLOAD_DIR: /uploads
    volumes:
      - ./uploads:/uploads
    networks: [tracker_net]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [tracker_net]

  # Daily pg_dump → ./backups on the host. Keeps 14 daily / 8 weekly /
  # 6 monthly snapshots, prunes the rest. Restore with:
  #   gunzip -c backups/daily/<file>.sql.gz | docker compose exec -T postgres \
  #     psql -U $POSTGRES_USER -d $POSTGRES_DB
  # The bind-mount makes it trivial to rsync the backups folder
  # off-host (cron job on the VM, or a once-a-day scp). Once that's
  # set up the backups survive a full VM loss.
  pg_backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-tracker}
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_EXTRA_OPTS: "-Z6 --no-owner --no-acl"
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "14"
      BACKUP_KEEP_WEEKS: "8"
      BACKUP_KEEP_MONTHS: "6"
      HEALTHCHECK_PORT: "8080"
    volumes:
      - ./backups:/backups
    networks: [tracker_net]

  # Off-host copy of the daily dumps. Loops every hour: if rclone is
  # configured (RCLONE_BACKUP_DEST set), it syncs ./backups -> remote.
  # If not, it sleeps quietly and the rest of the stack is unaffected.
  # Container is light — Alpine + rclone, ~30 MB.
  rclone_backup:
    image: rclone/rclone:latest
    restart: unless-stopped
    depends_on: [pg_backup]
    # Env vars of the form RCLONE_CONFIG_<REMOTE>_<KEY>=value configure
    # an rclone remote called <REMOTE> without needing a config file
    # on disk. See .env.example for B2 / S3 / GCS examples.
    environment:
      RCLONE_CONFIG_REMOTE_TYPE: ${RCLONE_CONFIG_REMOTE_TYPE:-}
      RCLONE_CONFIG_REMOTE_PROVIDER: ${RCLONE_CONFIG_REMOTE_PROVIDER:-}
      RCLONE_CONFIG_REMOTE_ENDPOINT: ${RCLONE_CONFIG_REMOTE_ENDPOINT:-}
      RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID: ${RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY:-}
      RCLONE_BACKUP_DEST: ${RCLONE_BACKUP_DEST:-}
    volumes:
      - ./backups:/backups:ro
    # Sleep 1h, check whether RCLONE_BACKUP_DEST is set. If yes, sync;
    # if no, log and loop. Idempotent — rclone sync only uploads
    # files that changed.
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          if [ -n "$$RCLONE_BACKUP_DEST" ]; then
            echo "rclone sync /backups -> $$RCLONE_BACKUP_DEST"
            rclone sync /backups "$$RCLONE_BACKUP_DEST" --transfers 4 || true
          else
            echo "rclone: RCLONE_BACKUP_DEST not set, skipping off-host copy"
          fi
          sleep 3600
        done
    networks: [tracker_net]

volumes:
  tracker_pgdata:
  # Caddy persists its issued Let's Encrypt certs + ACME state here.
  # Without this, Caddy would request a fresh cert on every restart
  # and you'd quickly hit Let's Encrypt's rate limits.
  caddy_data:
  caddy_config:

networks:
  tracker_net:
    driver: bridge
